<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>Página não encontrada — Poker Room</title>
  <link rel="icon" type="image/svg+xml" href="/poker-room/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f5f0e6;
      background:
        radial-gradient(circle at 50% 25%, rgba(31, 138, 85, 0.22), transparent 55%),
        #0b0c0e;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      border-radius: 20px;
      text-align: center;
      background: rgba(20, 23, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7);
    }
    .naipes {
      display: inline-flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .n {
      width: 34px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #fff;
      color: #111524;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }
    .n.r { color: #d61c33; }
    .codigo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d4a84f;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(245, 240, 230, 0.78);
      margin-bottom: 24px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #1f8a55;
      color: #fff;
      font-size: 15.5px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .cta:active { transform: translateY(0); }
  </style>
</head>
<body>
  <main class="card">
    <div class="naipes" aria-hidden="true">
      <span class="n">♠</span>
      <span class="n r">♥</span>
      <span class="n">♣</span>
      <span class="n r">♦</span>
    </div>
    <div class="codigo">Erro 404</div>
    <h1>Mesa não encontrada</h1>
    <p>O link que você acessou não existe ou foi encerrado. Volte para o lobby do Poker Room para entrar ou criar uma sala.</p>
    <a class="cta" id="btn-voltar" href="/poker-room/">Voltar para o Poker Room</a>
  </main>
  <script>
    (function () {
      if (window.location.hostname !== 'bentoxr.github.io') {
        var btn = document.getElementById('btn-voltar');
        if (btn) btn.setAttribute('href', './');
      }
    })();
  </script>
</body>
</html>
